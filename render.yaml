services:
  - type: web
    name: course-job-agent-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn job_agent.web_app:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.4
      - key: JOB_AGENT_DATA_DIR
        value: /var/data
      - key: OPENAI_BASE_URL
        value: https://api.gpt.ge/v1/
      - key: OPENAI_MODEL
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: PDF_PARSE_BASE_URL
        value: https://api.gpt.ge
      - key: PDF_PARSE_LAYOUT_MODEL
        value: doclayout_yolo
    disk:
      name: course-job-agent-data
      mountPath: /var/data
      sizeGB: 1
